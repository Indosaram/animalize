name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust_targets: ''
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libx11-dev libxtst-dev libxi-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install

      - name: Import Apple certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12
          security find-identity -v -p codesigning build.keychain

      - name: Build and attach to draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_TEAM_ID || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Animalize ${{ github.ref_name }}'
          releaseBody: |
            ## 다운로드

            | 내 컴퓨터 | 받을 파일 |
            |---|---|
            | Mac (M1~M4) | `*_aarch64.dmg` |
            | Mac (Intel) | `*_x64.dmg` |
            | Windows | `*_x64-setup.exe` |
            | Linux | `*.AppImage` 또는 `*.deb` |
            | 크롬 확장 | `animalize-chrome-extension.zip` |

            **Mac**: 애플 개발자 서명·공증된 앱이라 바로 열려요. 처음 실행하면 '손쉬운 사용' 권한을 켜 달라는 안내가 나와요.

            **크롬 확장 설치**: zip을 풀고 `chrome://extensions` → 오른쪽 위 '개발자 모드' 켜기 → '압축해제된 확장 프로그램을 로드합니다' → 푼 폴더 선택.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Notarize and staple dmg
        if: startsWith(matrix.platform, 'macos') && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for dmg in src-tauri/target/*/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            spctl -a -vvv -t open --context context:primary-signature "$dmg"
            name=$(basename "$dmg")
            asset_id=$(gh api "repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets" --jq ".[] | select(.name==\"$name\") | .id")
            [ -n "$asset_id" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset_id"
            gh api -X POST -H "Content-Type: application/octet-stream" --input "$dmg" "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=$name" --jq .name
          done

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run test
      - run: bun run build:ext
      - name: Zip extension
        run: cd extension/dist && zip -r ../../animalize-chrome-extension.zip .
      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Animalize ${{ github.ref_name }}'
          draft: true
          files: animalize-chrome-extension.zip
